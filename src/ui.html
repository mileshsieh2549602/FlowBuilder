<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Flow Builder for Figma</title>
    <style>
      :root {
        color-scheme: light;
        font-family: Roboto, Inter, system-ui, -apple-system, "Segoe UI", sans-serif;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        padding: 24px;
        background: #ffffff;
        color: #000000;
      }

      .panel {
        width: 320px;
        display: flex;
        flex-direction: column;
        gap: 20px;
      }

      .section-title {
        margin: 0;
        font-size: 13px;
        line-height: 15px;
        font-weight: 700;
        color: #000000;
      }

      .section-description {
        margin: 4px 0 0;
        font-size: 11px;
        line-height: 13px;
        color: #676767;
      }

      .connector-block {
        width: 223px;
      }

      .connector-preview {
        margin-top: 20px;
        display: flex;
        align-items: center;
        gap: 12px;
      }

      .endpoint {
        position: relative;
        width: 88px;
        height: 88px;
      }

      .side-btn {
        position: absolute;
        width: 16px;
        height: 16px;
        border: 1px solid #969696;
        border-radius: 3px;
        background: #ffffff;
        color: #969696;
        font-size: 13px;
        line-height: 13px;
        font-weight: 400;
        padding: 0;
        cursor: pointer;
      }

      .side-btn.active {
        border-color: #96c6fe;
        background: #ccedfe;
        color: #6fb1fe;
      }

      .side-top {
        left: 36px;
        top: 0;
      }

      .side-left {
        left: 0;
        top: 36px;
      }

      .side-right {
        left: 72px;
        top: 36px;
      }

      .side-bottom {
        left: 36px;
        top: 72px;
      }

      .node-box {
        position: absolute;
        left: 24px;
        top: 24px;
        width: 40px;
        height: 40px;
        border: 1px solid #969696;
        border-radius: 3px;
        background: #ffffff;
        color: #676767;
        font-size: 13px;
        line-height: 13px;
        display: flex;
        align-items: center;
        justify-content: center;
      }

      .node-box.active {
        border-color: #96c6fe;
        background: #ccedfe;
      }

      .connector-line {
        width: 23px;
        height: 2px;
        background: #96c6fe;
      }

      .divider {
        width: 100%;
        border-top: 1px solid #d2d2d2;
      }

      .node-types {
        margin-top: 20px;
        display: flex;
        gap: 20px;
      }

      .node-type-button {
        width: 65px;
        height: 50px;
        border: none;
        background: transparent;
        padding: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: flex-end;
        gap: 15px;
        cursor: pointer;
      }

      .node-type-button:not(.enabled) {
        cursor: default;
      }

      .node-type-icon {
        position: relative;
        border: 1px solid #afafaf;
      }

      .node-type-label {
        margin: 0;
        min-width: 65px;
        text-align: center;
        font-size: 11px;
        line-height: 13px;
        color: #afafaf;
      }

      .node-type-button.enabled .node-type-label {
        color: #676767;
      }

      .node-type-button.enabled .node-type-icon {
        border-color: #969696;
      }

      .node-type-button.active .node-type-icon {
        border-color: #96c6fe;
        background: #ccedfe;
      }

      .node-type-button.none .node-type-icon {
        width: 38px;
        height: 17px;
      }

      .node-type-button.process {
        gap: 11px;
      }

      .node-type-button.process .node-type-icon {
        width: 17px;
        height: 17px;
        transform: rotate(45deg);
        background: transparent;
      }

      .node-type-button.process.active .node-type-icon {
        border-color: #96c6fe;
        background: #ccedfe;
      }

      .node-type-button.start-end .node-type-icon {
        width: 38px;
        height: 17px;
        border-radius: 999px;
      }

      .node-type-button.yes-no .node-type-icon {
        width: 17px;
        height: 17px;
      }

      .status {
        margin-top: 8px;
        min-height: 16px;
        font-size: 11px;
        line-height: 16px;
      }

      .status.success {
        color: #157347;
      }

      .status.error {
        color: #b42318;
      }
    </style>
  </head>
  <body>
    <div class="panel">
      <div class="connector-block">
        <p class="section-title">Connector Sides</p>
        <p class="section-description">Hold &lt;Shift&gt;, then select two layers.</p>
        <div class="connector-preview">
          <div class="endpoint">
            <button class="side-btn side-top" data-endpoint="source" data-side="TOP" type="button">-</button>
            <button class="side-btn side-left" data-endpoint="source" data-side="LEFT" type="button">-</button>
            <div class="node-box" id="sourceNodeBox">A</div>
            <button class="side-btn side-right" data-endpoint="source" data-side="RIGHT" type="button">-</button>
            <button class="side-btn side-bottom" data-endpoint="source" data-side="BOTTOM" type="button">-</button>
          </div>
          <div class="connector-line"></div>
          <div class="endpoint">
            <button class="side-btn side-top" data-endpoint="target" data-side="TOP" type="button">-</button>
            <button class="side-btn side-left" data-endpoint="target" data-side="LEFT" type="button">-</button>
            <div class="node-box" id="targetNodeBox">B</div>
            <button class="side-btn side-right" data-endpoint="target" data-side="RIGHT" type="button">-</button>
            <button class="side-btn side-bottom" data-endpoint="target" data-side="BOTTOM" type="button">-</button>
          </div>
        </div>
      </div>

      <div class="divider"></div>

      <div>
        <p class="section-title">Node Type</p>
        <p class="section-description">Select a Flow Node first, then choose a node type.</p>
        <div class="node-types">
          <button class="node-type-button none" id="nodeTypeNone" data-node-type="none" type="button">
            <div class="node-type-icon"></div>
            <p class="node-type-label">None Node</p>
          </button>
          <button class="node-type-button process" id="nodeTypeProcess" data-node-type="process" type="button">
            <div class="node-type-icon"></div>
            <p class="node-type-label">Process</p>
          </button>
          <button class="node-type-button start-end" id="nodeTypeStartEnd" data-node-type="start-end" type="button">
            <div class="node-type-icon"></div>
            <p class="node-type-label">Start / End</p>
          </button>
          <button class="node-type-button yes-no" id="nodeTypeYesNo" data-node-type="yes-no" type="button">
            <div class="node-type-icon"></div>
            <p class="node-type-label">Y / N</p>
          </button>
        </div>
        <div id="panelStatus" class="status"></div>
      </div>
    </div>

    <script src="./ui.js"></script>
  </body>
</html>
